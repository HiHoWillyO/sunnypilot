name: Update opendbc submodule

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/HiHoWillyO/sunnypilot.git

      - name: Init and update opendbc submodule
        run: |
          git submodule init opendbc_repo
          git submodule update --remote opendbc_repo
          git add opendbc_repo
          git diff --cached --quiet || git commit -m "Update opendbc_repo to HiHoWillyO/opendbc HEAD"

      - name: Push
        run: git push origin master
